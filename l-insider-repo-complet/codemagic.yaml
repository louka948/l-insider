workflows:
  ios-unsigned:
    name: L'Insider - iOS unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Build unsigned .app
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build
      - name: Package unsigned .ipa
        script: |
          set -e
          APP_PATH=$(find build/Build/Products -name "*.app" -print -quit)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Aucun .app trouvé sous build/Build/Products :"
            find build/Build/Products
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r LInsider-unsigned.ipa Payload
    artifacts:
      - LInsider-unsigned.ipa
