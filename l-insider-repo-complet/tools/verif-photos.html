const grid = document.getElementById('grid');
const brokenNames = [];
let okCount = 0, badCount = 0;
const total = Object.keys(PLAYER_IMAGES).length;

function updateSummary() {
  document.getElementById('countOk').textContent = okCount;
  document.getElementById('countBad').textContent = badCount;
  document.getElementById('countPending').textContent = total - okCount - badCount;
  if (badCount > 0) {
    document.getElementById('brokenBox').style.display = 'block';
    document.getElementById('brokenList').value = brokenNames.join('\n');
  }
}

function copyList() {
  const ta = document.getElementById('brokenList');
  ta.select();
  document.execCommand('copy');
  document.getElementById('copyStatus').textContent = 'Copie !';
}

Object.entries(PLAYER_IMAGES).forEach(([name, url]) => {
  const card = document.createElement('div');
  card.className = 'card';
  const img = document.createElement('img');
  img.loading = 'eager';
  img.referrerPolicy = 'no-referrer';
  img.onload = () => {
    card.classList.add('ok');
    okCount++;
    updateSummary();
  };
  img.onerror = () => {
    card.classList.add('bad');
    badCount++;
    brokenNames.push(name);
    updateSummary();
  };
  img.src = url;
  const label = document.createElement('div');
  label.className = 'name';
  label.textContent = name;
  card.appendChild(img);
  card.appendChild(label);
  grid.appendChild(card);
});
updateSummary();
</script>
