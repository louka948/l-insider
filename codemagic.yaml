# NOTE : ce fichier est une copie miroir du VRAI codemagic.yaml, qui vit a
# la racine du depot GitHub (au-dessus de ce dossier local, qui correspond a
# "l-insider-repo-complet/" sur GitHub). Codemagic ne lit que le
# codemagic.yaml a la racine reelle du repo -- c'est pour ca que les chemins
# ci-dessous commencent par "l-insider-repo-complet/". Garde ce fichier en
# local pour l'historique/diff, mais toute modification doit etre repoussee
# manuellement sur GitHub a la racine (pas dans ce sous-dossier), via
# https://github.com/louka948/l-insider/upload/main
workflows:
  ios-unsigned:
    name: L'Insider - iOS unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.4
      vars:
        XCODE_PROJECT: "l-insider-repo-complet/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies and sync web assets
        script: |
          set -e
          cd l-insider-repo-complet
          npm install
          cd build
          npm install
          cd ..
          npm run cap:sync
      - name: Build unsigned .app
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build
      - name: Package unsigned .ipa
        script: |
          set -e
          APP_PATH=$(find build/Build/Products -name "*.app" -print -quit)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Aucun .app trouve sous build/Build/Products :"
            find build/Build/Products
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r LInsider-unsigned.ipa Payload
    artifacts:
      - LInsider-unsigned.ipa
    publishing:
      # Meme raison que pour android-debug plus bas : le lien de telechargement
      # de l'interface web Codemagic exige une session connectee (403 sinon).
      # Ajoute le 26 aout 2026, apres avoir constate que ce workflow n'avait
      # pas encore ce bloc (contrairement a android-debug) alors que le meme
      # probleme s'applique au .ipa.
      email:
        recipients:
          - loukainiesta@gmail.com
        notify:
          success: true
          failure: false

  android-debug:
    # Linux (linux_x2/linux_x4) n'est disponible qu'avec facturation activee
    # sur ce compte Codemagic (pas de minutes gratuites hors macOS) -> on
    # construit l'APK Android sur la meme machine Mac gratuite que l'iOS
    # (500 min/mois offertes), qui inclut aussi le SDK Android + Gradle.
    # JDK 21 (pas 17) : capacitor.build.gradle genere par `cap sync` impose
    # sourceCompatibility/targetCompatibility JavaVersion.VERSION_21 -- avec
    # java:17 le build echoue avec "invalid source release: 21" (constate le
    # 26 aout 2026, build #2).
    name: L'Insider - Android build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 21
      node: latest
    scripts:
      - name: Install dependencies and sync Android project
        script: |
          set -e
          cd l-insider-repo-complet
          npm install
          cd build
          npm install
          cd ..
          npm run build
          mkdir -p www
          cp index.html www/index.html
          # IMPORTANT (decouvert le 27 aout 2026, build #7) : le dossier
          # android/ n'est en realite PAS versionne sur GitHub (seulement en
          # local dans les sessions Claude precedentes) -- seul un sous-arbre
          # partiel (android/app/src/main/res/mipmap-*, ajoute pour l'icone)
          # existe sur le repo distant. L'ancien test `[ ! -d android ]`
          # devenait donc faux a cause de ce sous-arbre partiel, sautait
          # `cap add android`, et le build echouait sur "gradlew: No such
          # file or directory". On teste maintenant la presence de gradlew
          # lui-meme (marqueur d'un vrai projet Capacitor complet) et on
          # repart d'un dossier propre si besoin.
          if [ ! -f android/gradlew ]; then rm -rf android && npx cap add android; fi
          npx cap sync android
      - name: Patch AndroidManifest (deep link connexion Google)
        script: |
          set -e
          cd l-insider-repo-complet
          # android/ n'etant pas versionne (voir note ci-dessus), le
          # AndroidManifest.xml genere par `cap add android` est toujours le
          # template Capacitor par defaut, SANS le intent-filter du schema
          # d'URL personnalise (com.imposteurfoot.app://...) necessaire au
          # retour de la connexion Google (voir handleGoogleSignIn dans
          # AccountScreen.jsx + le meme intent-filter dans le
          # AndroidManifest.xml local de ce depot, qui sert de reference
          # mais n'atteint jamais GitHub). Sans ce patch, l'OS ne saurait
          # pas relancer l'app quand Supabase redirige vers ce schema apres
          # Google -- l'utilisateur resterait bloque dans le navigateur
          # systeme. Ajoute le 3 sept. 2026.
          python3 - <<'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          marker = '<category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>'
          if marker not in content:
              raise SystemExit("Marqueur introuvable dans AndroidManifest.xml -- le template Capacitor a change, voir CLAUDE.md.")
          insertion = marker + '''

            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="com.imposteurfoot.app" />
            </intent-filter>'''
          content = content.replace(marker, insertion, 1)
          with open(path, "w") as f:
              f.write(content)
          print("AndroidManifest.xml patche : intent-filter deep link Google ajoute.")
          PYEOF
      - name: Apply custom app icon
        script: |
          set -e
          cd l-insider-repo-complet
          # Reutilise l'icone iOS deja versionnee (ballon masque) comme
          # source pour generer l'icone Android -- evite de dupliquer les
          # assets et garantit que les deux plateformes restent identiques.
          # Ajoute le 27 aout 2026 : android/ n'etant pas versionne (voir
          # note ci-dessus), l'icone par defaut de Capacitor revenait a
          # chaque build tant que cette etape n'existait pas.
          mkdir -p resources
          cp "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png" resources/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0D2B1F' --iconBackgroundColorDark '#0D2B1F'
      - name: Build debug APK
        script: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          cd l-insider-repo-complet/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - l-insider-repo-complet/android/app/build/outputs/apk/debug/*.apk
    publishing:
      # Envoie un e-mail avec un lien de telechargement de l'APK qui ne
      # necessite PAS d'etre connecte a Codemagic (contrairement au lien de
      # telechargement affiche dans l'interface web, qui renvoie une erreur
      # 403 FORBIDDEN si on l'ouvre depuis un telephone non connecte a
      # Codemagic). Duree de validite du lien : reglee sur 24h dans
      # Personal Account settings > Artifact download links.
      email:
        recipients:
          - loukainiesta@gmail.com
        notify:
          success: true
          failure: false
