workflows:
  ios-unsigned:
    name: L'Insider - iOS unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "l-insider-repo-complet/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies and sync web assets
        script: |
          set -e
          cd l-insider-repo-complet
          npm install
          cd build
          npm install
          cd ..
          npm run cap:sync
      - name: Build unsigned .app
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build
      - name: Package unsigned .ipa
        script: |
          set -e
          APP_PATH=$(find build/Build/Products -name "*.app" -print -quit)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Aucun .app trouve sous build/Build/Products :"
            find build/Build/Products
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r LInsider-unsigned.ipa Payload
    artifacts:
      - LInsider-unsigned.ipa

  android-debug:
    name: L'Insider - Android build
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      java: 17
      node: latest
    scripts:
      - name: Install dependencies and sync Android project
        script: |
          set -e
          cd l-insider-repo-complet
          npm install
          cd build
          npm install
          cd ..
          npm run build
          mkdir -p www
          cp index.html www/index.html
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build debug APK
        script: |
          set -e
          cd l-insider-repo-complet/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - l-insider-repo-complet/android/app/build/outputs/apk/debug/*.apk
